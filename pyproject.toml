[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sun-solar-radiation"
version = "0.1.1"
description = "GPU-accelerated solar radiation modeling for digital elevation models"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Raphael Prinz", email = "raphael.prinz1993@gmail.com"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
keywords = ["solar", "radiation", "gis", "dem", "gpu", "renewable-energy"]

[project.urls]
Homepage = "https://github.com/raphi-web/sun-solar-radiation"
Repository = "https://github.com/raphi-web/sun-solar-radiation"
Issues = "https://github.com/raphi-web/sun-solar-radiation/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "sun"
