[package]
name = "sun"
version = "0.1.2"
edition = "2024"

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

[lib]
name = "sun"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sun"
path = "src/main.rs"
required-features = ["gdal-io"]

[features]
default = []
# Path-based raster I/O (GeoTIFF in/out) for the `sun` CLI binary and the
# legacy path-based PyO3 functions. The Python extension for the QGIS plugin
# builds WITHOUT this feature: raster I/O happens in Python, so the .so has
# no GDAL linkage and builds on any platform.
gdal-io = ["dep:gdal", "dep:clap"]

[dependencies]
gdal = { version = "0.17", features = ["bindgen"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
rayon = "1"


[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
# unwind, not abort: this library runs inside host processes (QGIS, Python).
# wgpu reports a lost GPU device by panicking; gpu_array catches that and
# returns an error. With panic = "abort" the whole host process died.
panic = "unwind"
incremental = false
overflow-checks = false
strip = true
