name: Build Wheels

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GDAL (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install GDAL (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install gdal@3.9
          brew link gdal@3.9 --force

      - name: Install GDAL (Windows)
        if: matrix.platform == 'windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.12'
          channels: conda-forge
          activate-environment: test

      - name: Install GDAL via conda (Windows)
        if: matrix.platform == 'windows'
        shell: bash -l {0}
        run: |
          conda install -y gdal
          # Set GDAL environment variables for Rust gdal-sys
          CONDA_PREFIX=$(conda info --base)/envs/test
          echo "GDAL_HOME=$CONDA_PREFIX/Library" >> $GITHUB_ENV
          echo "GDAL_LIB_DIR=$CONDA_PREFIX/Library/lib" >> $GITHUB_ENV
          echo "GDAL_INCLUDE_DIR=$CONDA_PREFIX/Library/include" >> $GITHUB_ENV
          # Add to PATH for runtime
          echo "$CONDA_PREFIX/Library/bin" >> $GITHUB_PATH
          echo "$CONDA_PREFIX/Library/lib" >> $GITHUB_PATH

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        if: matrix.platform != 'windows'
        run: maturin build --release

      - name: Build wheels (Windows)
        if: matrix.platform == 'windows'
        shell: bash -l {0}
        run: |
          maturin build --release

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: target/wheels/*.whl

  publish:
    name: Publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
