name: Build Windows Wheel

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows wheel
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.12'
          channels: conda-forge

      - name: Install GDAL via conda
        shell: bash -l {0}
        run: |
          conda install -y gdal
          # Set GDAL environment variables for Rust gdal-sys
          CONDA_PREFIX=$(conda info --base)/envs/test
          echo "GDAL_HOME=$CONDA_PREFIX/Library" >> $GITHUB_ENV
          echo "GDAL_LIB_DIR=$CONDA_PREFIX/Library/lib" >> $GITHUB_ENV
          echo "GDAL_INCLUDE_DIR=$CONDA_PREFIX/Library/include" >> $GITHUB_ENV
          # Add to PATH for runtime
          echo "$CONDA_PREFIX/Library/bin" >> $GITHUB_PATH
          echo "$CONDA_PREFIX/Library/lib" >> $GITHUB_PATH
          # Verify gdal_i.lib exists
          ls -la "$CONDA_PREFIX/Library/lib/" | grep -i gdal || echo "gdal_i.lib not found in lib"
          ls -la "$CONDA_PREFIX/Library/bin/" | grep -i gdal || echo "gdal not found in bin"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        shell: bash -l {0}
        run: |
          # Re-set GDAL env vars for this step
          CONDA_PREFIX=$(conda info --base)/envs/test
          export GDAL_HOME="$CONDA_PREFIX/Library"
          export GDAL_LIB_DIR="$CONDA_PREFIX/Library/lib"
          export GDAL_INCLUDE_DIR="$CONDA_PREFIX/Library/include"
          
          # Debug: Find where gdal_i.lib actually is
          echo "=== Searching for gdal_i.lib ==="
          find "$CONDA_PREFIX" -name "gdal*.lib" 2>/dev/null || true
          find "$CONDA_PREFIX" -name "libgdal*" 2>/dev/null || true
          
          # Check if the file exists in expected location
          if [ -f "$GDAL_LIB_DIR/gdal_i.lib" ]; then
            echo "✓ Found gdal_i.lib in $GDAL_LIB_DIR"
          else
            echo "✗ gdal_i.lib NOT found in $GDAL_LIB_DIR"
            echo "Contents of $GDAL_LIB_DIR:"
            ls -la "$GDAL_LIB_DIR" | head -20 || true
          fi
          
          echo "Building with GDAL from: $GDAL_LIB_DIR"
          maturin build --release

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: target/wheels/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
