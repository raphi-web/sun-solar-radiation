name: Build Wheels

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GDAL (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install GDAL (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install gdal

      - name: Install GDAL (Windows)
        if: matrix.platform == 'windows'
        run: |
          # Use conda to install GDAL on Windows
          $env:CONDA_EXE = "C:\Miniconda3\condabin\conda.exe"
          & $env:CONDA_EXE install -y -c conda-forge gdal
          # Add conda environment to PATH
          $condaEnv = & $env:CONDA_EXE info --base
          echo "$condaEnv\Library\bin" >> $env:GITHUB_PATH
          echo "$condaEnv\Scripts" >> $env:GITHUB_PATH

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        run: maturin build --release

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: target/wheels/*.whl

  publish:
    name: Publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
