name: Build Wheels

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      # No GDAL, no conda, no pkg-config: the extension is built without the
      # gdal-io feature, so it only needs Rust + Python headers. Raster I/O
      # lives in the QGIS plugin's Python side.
      - name: Build wheel
        run: maturin build --release

      - name: Smoke-test wheel
        shell: bash
        run: |
          pip install numpy
          pip install --force-reinstall target/wheels/sun_solar_radiation-*.whl
          python -c "
          import numpy as np, sun
          assert hasattr(sun, 'compute_raster_bands')
          assert hasattr(sun, 'compute_annual_bands')
          assert hasattr(sun, 'horn_slope_aspect')
          assert not hasattr(sun, 'compute_raster'), 'path API leaked into wheel'
          elev = np.full(30 * 20, 500.0, dtype=np.float32)
          lat = np.full(20, 47.5, dtype=np.float32)
          out = sun.compute_raster_bands(elev, 30, 20, lat, 172, step=0.5,
                                         dx_m=30.0, dy_m=30.0, outputs=['glob'])
          glob = np.asarray(out['glob'])
          assert glob.shape == (600,)
          valid = glob[glob != -9999.0]
          assert valid.size > 0 and 500 < valid.max() < 15000, valid.max()
          print('OK:', sun.__file__, '- array API computes on this platform')
          "

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl

  publish:
    name: Publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
